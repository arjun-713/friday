name: Quality checks

on:
  push:
    branches:
      - "**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PIP_PROGRESS_BAR: "off"

defaults:
  run:
    working-directory: backend

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend development dependencies
        run: python -m pip install --quiet -e ".[dev]"
      - name: Lint
        run: ruff check --output-format concise src tests
      - name: Check formatting
        run: ruff format --check src tests

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend development dependencies
        run: python -m pip install --quiet -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend development dependencies
        run: python -m pip install --quiet -e ".[dev]"
      - name: Run type checker
        run: mypy

  deepeval-calibration:
    # Judge-only eval gate: no Qdrant, models, or indexed data needed
    # (calibration makes zero app calls). Skips cleanly without a key.
    # App-dependent suites (RAG/conversation/agent/voice/simulator) need the
    # gitignored manual corpus, embedding artifact, and indexed collection,
    # so they run manually/nightly — see docs/eval-deepeval.md.
    name: deepeval-calibration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend development dependencies
        run: python -m pip install --quiet -e ".[dev]"
      - name: Validate eval judges and dataset contracts
        run: deepeval test run eval/evals/test_calibration.py eval/evals/test_rag.py::test_dataset_contract --identifier ci-calibration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check frontend
        run: npx tsc --noEmit
      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
