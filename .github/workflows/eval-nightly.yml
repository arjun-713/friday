name: Eval nightly (strong judge)

# PAUSED: no trusted judge exists at $0 spend (see docs/eval-deepeval.md
# "Local-judge benchmark"). Schedule disabled; manual dispatch only, for use
# when model access returns. App-turn suites stay manual/local regardless:
# they need the gitignored manual corpus, embedding artifact, and indexed
# collection, which free runners cannot reconstruct.
on:
  # schedule:
  #   - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-judges:
    name: nightly judges (gpt-4o)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend development dependencies
        run: python -m pip install --quiet -e "./backend[dev]"

      - name: Calibration + dataset contracts (trusted judge)
        run: deepeval test run eval/evals/test_calibration.py eval/evals/test_rag.py::test_dataset_contract --identifier nightly-judges
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
