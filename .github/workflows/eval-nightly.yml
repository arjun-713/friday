name: Eval nightly (strong judge)

# Judge-drift detection + contract checks with the trusted gpt-4o judge.
# App-turn suites (RAG/conversation/agent/voice/simulator) stay manual/local:
# they need the gitignored manual corpus, embedding artifact, and indexed
# collection, which free runners cannot reconstruct. See docs/eval-deepeval.md.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-judges:
    name: nightly judges (gpt-4o)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend development dependencies
        run: python -m pip install --quiet -e "./backend[dev]"

      - name: Calibration + dataset contracts (trusted judge)
        run: deepeval test run eval/evals/test_calibration.py eval/evals/test_rag.py::test_dataset_contract --identifier nightly-judges
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
