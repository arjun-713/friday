# Non-secret Friday runtime configuration.
# API keys belong only in .env and are referenced by api_key_env below.

llm:
  enabled: true
  model: openai/gpt-6-luna
  # GPT-6 Luna supports Chat Completions with reasoning_effort: none. Keep this
  # transport for the existing streaming and function-call event handling.
  api_mode: chat_completions
  api_key_env: OPENAI_API_KEY
  temperature: 0.1
  # Diagnostic turns are intentionally concise: the UI renders the action and
  # evidence separately, so a large completion budget only increases latency.
  max_tokens: 140
  timeout_seconds: 15
  max_retries: 0
  # The agentic / non-stream path parses a diagnostic turn object. The
  # conversation stream remains unstructured because it passes structured=false
  # and emits natural-language tokens directly.
  # json_object is the default structured-output mode: it coexists with tool
  # calling on all supported providers (strict json_schema does not on Groq,
  # and showed no retry reduction on Luna in A/B measurement).
  response_format: json_object
  # Streaming gate experiment arms (see docs/rag-performance.md). Defaults keep
  # validated-only speech: planner schema orders `response` last and the gate
  # withholds it until every other field validates.
  # planner_response_position: last
  # streaming_gate: strict
  # Provider-managed prefix caching is enabled when the selected provider
  # supports it. Groq currently ignores this because it has no documented
  # prompt-cache contract; switching providers requires no code change.
  prompt_cache_enabled: true
  prompt_cache_key: friday-grounded-conversation
  # GPT-6 uses the current prompt-cache options shape. This is a cache
  # lifetime hint, not a response cache; each diagnostic answer is generated.
  prompt_cache_ttl: 30m
  verbosity: low
  # Luna supports explicit reasoning control. Keep it off for the interactive
  # troubleshooting path so visible output can start as soon as possible.
  reasoning_effort: none
  agentic_enabled: true
  max_tool_calls: 2

voice:
  stt:
    enabled: true
    model: saaras:v3-realtime
    language: en-IN
    mode: transcribe
    stream_type: fast
    endpointing: vad
    encoding: linear16
    sample_rate: 16000
    # Require stronger, longer speech evidence before treating microphone
    # noise as an interruption or finalizing a short pause as a turn.
    vad_threshold: 0.55
    silence_ms: 1000
    min_speech_ms: 400
    endpoint: wss://api.sarvam.ai/speech-to-text-realtime/ws
  tts:
    enabled: true
    model: bulbul:v3
    language: en-IN
    speaker: manan
    pace: 1.0
    sample_rate: 24000
    codec: linear16
    send_completion_event: true
    endpoint: wss://api.sarvam.ai/text-to-speech/ws
