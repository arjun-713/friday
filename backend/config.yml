# Non-secret Friday runtime configuration.
# API keys belong only in .env and are referenced by api_key_env below.

llm:
  enabled: true
  model: openai/sarvam-105b-conversations
  api_base: https://api.sarvam.ai/v1
  api_key_env: SARVAM_API_KEY
  temperature: 0.4
  # Diagnostic turns are intentionally concise: the UI renders the action and
  # evidence separately, so a large completion budget only increases latency.
  max_tokens: 700
  timeout_seconds: 60
  max_retries: 0
  # Sarvam Structured Outputs: guarantees the diagnostic response has all
  # required fields, including a non-empty source_ids list.
  response_format: json_schema
  # The retrieval layer and local validation provide the diagnostic guardrails.
  # Disable Sarvam's optional hidden reasoning so the conversation can begin
  # as soon as the grounded response is available.
  disable_reasoning: true

voice:
  stt:
    enabled: true
    model: saaras:v3-realtime
    language: en-IN
    mode: transcribe
    stream_type: fast
    endpointing: vad
    encoding: linear16
    sample_rate: 16000
    vad_threshold: 0.3
    silence_ms: 500
    min_speech_ms: 250
    endpoint: wss://api.sarvam.ai/speech-to-text-realtime/ws
  tts:
    enabled: true
    model: bulbul:v3
    language: en-IN
    speaker: manan
    pace: 1.0
    sample_rate: 24000
    codec: linear16
    send_completion_event: true
    endpoint: wss://api.sarvam.ai/text-to-speech/ws
