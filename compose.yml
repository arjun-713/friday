name: friday

services:
  qdrant:
    image: qdrant/qdrant:v1.14.1
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    env_file:
      - backend/.env
    environment:
      FRIDAY_ROOT: /app
      FRIDAY_CONFIG: /app/backend/config.yml
      QDRANT_URL: http://qdrant:6333
      HF_HOME: /app/data/models/huggingface
      TRANSFORMERS_CACHE: /app/data/models/huggingface
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  qdrant_storage:
