name: friday

services:
  qdrant:
    image: qdrant/qdrant:v1.14.1
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The minimal Qdrant image has no curl/wget. Process liveness is the
      # portable check; the backend performs the real collection read on boot.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    env_file:
      - backend/.env
    environment:
      FRIDAY_ROOT: /app
      FRIDAY_CONFIG: /app/backend/config.yml
      EMBEDDING_BACKEND: onnx
      EMBEDDING_MODEL: /app/data/models/granite-small-r2-onnx
      EMBEDDING_MODEL_FILE: onnx/model_int8-avx2.onnx
      EMBEDDING_WARMUP: "true"
      QDRANT_URL: http://qdrant:6333
      HF_HOME: /app/data/models/huggingface
      TRANSFORMERS_CACHE: /app/data/models/huggingface
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  qdrant_storage:
